name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build portable exe
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: MCLA_ModTool_2
          path: dist/MCLA_ModTool_2.exe
